name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven test selector (e.g. -Dtest=JsonReaderTest); empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify ${{ inputs.test-filter }} -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: Report skipped tests
        if: always()
        run: |
          echo "Skipped tests (from surefire XML reports):"
          grep -h -B1 "<skipped" */target/surefire-reports/TEST-*.xml || echo "none"
          echo "Note: JsonReaderPathTest.multipleTopLevelValuesInOneDocument[OBJECT_READER] is skipped by upstream's assumeTrue(factory == Factory.STRING_READER): multiple top-level values only apply to a string-backed JsonReader, not JsonTreeReader."
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
